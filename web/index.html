<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neko Studio</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar tile"><a class="brand" href="/" aria-label="Neko Studio"><span class="mark" aria-hidden="true">n</span><span>neko <b class="brand-sub">STUDIO</b></span></a><div class="project-title"><input id="project-name" aria-label="项目名称" data-i18n-aria-label="projectName"><span id="dirty">本地项目</span></div><div class="top-actions"><span class="engine-chip" data-i18n="engine">Rust 引擎</span><label class="language-control"><span data-i18n="language">界面语言</span><select id="language"><option value="zh-CN" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select></label><a class="ghost" href="/play" target="_blank" rel="noopener" title="打开纯播放器（新窗口）" data-i18n-title="openPlayer" data-i18n="play">▷ 游玩</a><button id="save" class="ghost">导出 .bcmkn ↗</button><button id="save-packed" class="ghost" data-i18n="packedExport" data-i18n-title="packedHint" title="压缩大文本列表；作品启动时自动解压">压缩导出</button><button id="open" class="primary" data-i18n="importStudio" data-i18n-title="importHint" title="选择 Kitten4 .bcm 或 Kitten N .bcmkn 文件，也可以直接拖入窗口">导入 .bcm / .bcmkn</button><input type="file" id="file" accept=".bcm,.bcmkn,.json" hidden></div></header>
<main class="bento">
<aside class="library">
  <section class="tile resources"><div class="section-head"><h2 data-i18n="resources">项目资源</h2><span id="project-version" class="small-tag">0.27.4</span></div><div class="eyebrow" data-i18n="scenes">场景</div><div id="scenes"></div><div class="eyebrow" data-i18n="sprites">角色</div><div id="sprites"></div><div class="eyebrow">自制积木</div><div id="procedures"></div></section>
  <section class="tile block-library"><div class="section-head"><h2 data-i18n="library">积木库</h2></div><input id="search" class="search" placeholder="搜索积木…" aria-label="搜索积木" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="search"><div class="category-pills" role="group" aria-label="积木分类" data-i18n-aria-label="categories"><button type="button" class="chosen" aria-pressed="true" data-category="" data-i18n="all">全部</button><button type="button" aria-pressed="false" data-category="event" data-i18n="events">事件</button><button type="button" aria-pressed="false" data-category="motion" data-i18n="motion">动作</button><button type="button" aria-pressed="false" data-category="pen" data-i18n="pen">画笔</button></div><div id="palette"></div></section>
</aside>
<section class="workspace tile"><div class="workspace-bar"><div class="tabs" role="tablist" aria-label="工作区视图" data-i18n-aria-label="workspaceTabs"><button id="blocks-tab" class="tab active" data-tab="blocks" role="tab" aria-selected="true" aria-controls="blocks" data-i18n="blocks">积木编排</button><button id="json-tab" class="tab" data-tab="json" role="tab" tabindex="-1" aria-selected="false" aria-controls="json-panel" data-i18n="source">项目源码</button></div><div class="workspace-tools"><button id="undo" title="撤销" aria-label="撤销" data-i18n-title="undo" data-i18n-aria-label="undo">↶</button><button id="redo" title="重做" aria-label="重做" data-i18n-title="redo" data-i18n-aria-label="redo">↷</button><span></span><button id="deselect" data-i18n="deselect">取消选择</button></div></div><div class="workspace-context"><div><span class="eyebrow" data-i18n="workspace">工作区</span><h1 id="owner-name">画笔</h1></div><span class="context-note" data-i18n="appendHint">选择积木后可追加指令</span></div><div id="health-location" class="health-location" role="status" tabindex="-1" hidden></div><div id="blocks" class="block-canvas" role="tabpanel" aria-labelledby="blocks-tab" tabindex="0"></div><div id="json-panel" role="tabpanel" aria-labelledby="json-tab" hidden><p id="json-note" class="context-note">内部规范 KN JSON</p><textarea id="json-source" spellcheck="false" aria-label="内部规范项目 JSON" data-i18n-aria-label="jsonLabel" aria-describedby="json-note"></textarea><button class="primary" id="apply-json" data-i18n="apply">应用更改</button></div><div class="workspace-footer"><span><i class="status-dot"></i><span id="compile-status" role="status">等待编译</span></span><span id="instruction-count">BYTECODE VM</span></div></section>
<aside class="preview">
  <section class="tile stage-tile"><div class="stage-heading"><h2 data-i18n="stage">舞台</h2><span id="stage-size"></span></div><div class="stage-wrap"><canvas id="stage" tabindex="0" aria-label="舞台预览；Tab 可移出舞台" data-i18n-aria-label="stagePreview"></canvas><div class="stage-badge">WebGL 2</div></div><div class="transport"><div><button id="run" class="primary" data-i18n="run">▶ 运行</button><button id="pause" class="icon-button" title="暂停" aria-label="暂停" data-i18n-title="pause" data-i18n-aria-label="pause">Ⅱ</button><button id="stop" class="icon-button" title="停止" aria-label="停止" data-i18n-title="stop" data-i18n-aria-label="stop">■</button><button id="step" class="ghost" data-i18n="step">单步 →</button></div><span id="runtime-state" role="status"><i></i>就绪</span></div></section>
  <section id="health-report" class="tile health-report" aria-labelledby="health-title"><div class="section-head"><h2 id="health-title">作品体检</h2></div><p class="health-note">尚无体检数据。</p></section>
  <section class="tile performance"><div class="section-head"><h2 data-i18n="performance">性能</h2><span class="small-tag" id="transport-kind">WEBSOCKET</span></div><div class="metrics"><div><span data-i18n="executeTime">执行耗时</span><strong id="vm-time">—</strong><small data-i18n="msFrame">ms / 帧</small></div><div><span data-i18n="renderTime">渲染提交</span><strong id="render-time">—</strong><small data-i18n="cpuFrame">CPU ms / 帧</small></div><div><span data-i18n="updates">运行更新</span><strong id="fps">—</strong><small data-i18n="perSecond">次 / 秒</small></div></div><canvas id="chart" width="440" height="52" aria-hidden="true"></canvas><div class="perf-detail"><span><span data-i18n="ops">指令</span> <b id="ops">0</b></span><span><span data-i18n="transfer">传输</span> <b id="bytes">0 B</b></span><span><span data-i18n="draws">绘制</span> <b id="draws">0</b></span><span><span data-i18n="roundtrip">往返</span> <b id="roundtrip">—</b></span><span><span data-i18n="decode">解码</span> <b id="decode-time">—</b></span><span>GPU <b id="gpu-time">—</b></span></div><p class="perf-note" data-i18n="perfNote">统计收到并提交的运行更新，不等于作品画面 FPS；GPU 时间异步采样。</p></section>
  <section class="tile inspector"><div class="section-head"><h2 data-i18n="properties">角色属性</h2><span id="actor-badge" class="small-tag" data-i18n="sprite">角色</span></div><div id="properties"></div></section>
  <section class="tile console"><div class="section-head"><h2 data-i18n="logs">运行日志</h2><button id="clear-console" class="ghost small" data-i18n="clear">清空</button></div><div id="logs" role="log" tabindex="0" aria-label="运行日志" data-i18n-aria-label="logs"><p class="muted" data-i18n="logHint">编译诊断与运行输出将显示在这里。</p></div></section>
</aside>
</main><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
